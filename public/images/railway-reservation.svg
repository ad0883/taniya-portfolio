  </defs>
  <rect width="800" height="560" rx="16" fill="url(#glow)"/>
  <rect width="800" height="560" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="798" height="558" rx="15" fill="none" stroke="#2b5758"/>
  <g font-family="Arial, Helvetica, sans-serif">
